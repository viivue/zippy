[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zippy"
version = "0.1.1"
description = "Local web UI wrapping imgopt, imgresize, vidopt, and fontslice behind a FastAPI server."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "vidopt",
    "imgopt",
    "imgresize",
    "fontslice",
]

[project.optional-dependencies]
window = [
    "pywebview>=5.0",
]

[project.scripts]
zippy = "zippy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zippy"]

[tool.uv.sources]
vidopt = { workspace = true }
imgopt = { workspace = true }
imgresize = { workspace = true }
fontslice = { workspace = true }
