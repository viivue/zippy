[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidopt"
version = "0.1.0"
description = "Optimise MP4/MOV videos for web delivery using ffmpeg."
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.0",  # progress bars for batch processing; gracefully skipped if missing
]

[project.scripts]
vidopt = "vidopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vidopt"]
