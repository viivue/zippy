[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fontslice"
version = "0.1.1"
description = "Subset and convert variable/static fonts to optimized woff2 files."
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.0",
    "brotli>=1.0",
]

[project.scripts]
fontslice = "fontslice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fontslice"]
